<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Nicole Matanga">
    <meta name="author" content="Nicole Matanga">

    <title>Filtered Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/filtered-temples.css">

    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>

    <header>
        <h1>Temple Album</h1>

        <button id="hamburgerBtn"
                type="button"
                aria-label="Open navigation"
                aria-expanded="false">
            ☰
        </button>

        <nav id="primaryNav">
            <a href="#" data-filter="home" class="active">Home</a>
            <a href="#" data-filter="old">Old</a>
            <a href="#" data-filter="new">New</a>
            <a href="#" data-filter="large">Large</a>
            <a href="#" data-filter="small">Small</a>
        </nav>
    </header>

    <main>

        <h2 id="galleryTitle">Home</h2>

        <section class="temple-grid" id="templeGrid">
        </section>

    </main>

    <footer>
        <p>
            © 2026<span id="copyrightYear"></span>
            | 🦋 Nicole Matanga 🦋
            | United Kingdom, England
        </p>

        <p>
            Last Modified:
            <span id="lastModifiedDate"></span>
        </p>
    </footer>

</body>
</html>
