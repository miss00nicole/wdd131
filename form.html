
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review">
    <meta name="author" content="Nicole Matanga">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">

            <!-- Product Name -->
            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-group">
                <legend>Overall Rating</legend>

                <div class="rating-options">
                    <label for="rating1">
                        <input type="radio" id="rating1"
                            name="rating" value="1" required>
                        <span>★</span>
                        <small>1</small>
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2"
                            name="rating" value="2">
                        <span>★★</span>
                        <small>2</small>
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3"
                            name="rating" value="3">
                        <span>★★★</span>
                        <small>3</small>
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4"
                            name="rating" value="4">
                        <span>★★★★</span>
                        <small>4</small>
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5"
                            name="rating" value="5">
                        <span>★★★★★</span>
                        <small>5</small>
                    </label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate"
                    name="installDate" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="form-group">
                <legend>Which features did you find useful?</legend>
                <p class="hint">(Check all that apply)</p>

                <div class="checkbox-group">
                    <label for="durability">
                        <input type="checkbox" id="durability"
                            name="features" value="Durability">
                        Durability
                    </label>

                    <label for="ease">
                        <input type="checkbox" id="ease"
                            name="features" value="Ease of Use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance"
                            name="features" value="Performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design"
                            name="features" value="Design">
                        Design
                    </label>
                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="form-group">
                <label for="writtenReview">
                    Written Review (Optional)
                </label>
                <textarea id="writtenReview"
                    name="writtenReview"
                    rows="5"
                    placeholder="Write your review here..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName"
                    placeholder="Enter your name">
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Post Review" class="submit-btn">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 | 💜Product Review Form💜</p>
        <p>💜Nicole Matanga💜</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
